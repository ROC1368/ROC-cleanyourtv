name: Build CleanYourTV for Dangbei Android 7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android 7.1 launcher
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out official v2.7 source
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: v2.7.0

      - name: Patch minimum SDK and backport Java APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("launcher/app/build.gradle")
          text = gradle.read_text(encoding="utf-8")
          assert text.count("minSdk 26") == 1, "Unexpected minSdk in upstream v2.7"
          text = text.replace("minSdk 26", "minSdk 25", 1)
          marker = "    compileOptions {\n"
          assert text.count(marker) == 1, "Missing compileOptions"
          text = text.replace(marker, "    compileOptions {\n        coreLibraryDesugaringEnabled true\n", 1)
          marker = "dependencies {\n"
          assert text.count(marker) == 1, "Missing dependencies block"
          text = text.replace(marker, "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n", 1)
          gradle.write_text(text, encoding="utf-8")

          # Persist the once-per-boot marker before leaving Home. Avoid
          # repeated automatic Live TV launches on slower Android TV boxes.
          main = Path("launcher/app/src/main/java/com/gathin/tvhome/MainActivity.java")
          source = main.read_text(encoding="utf-8")
          old = 'prefs.edit().putInt("live_tv_boot", boot).apply();'
          new = 'if (!prefs.edit().putInt("live_tv_boot", boot).commit()) return false;'
          assert source.count(old) == 1, "Unexpected boot marker implementation"
          main.write_text(source.replace(old, new, 1), encoding="utf-8")
          print("Patched minSdk=25, Java core library desugaring and one-time boot launch.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build experimental Android 7 APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PlauncherApplicationId=com.gathin.tvhome

      - name: Verify package and minSdk
        shell: bash
        run: |
          APK="launcher/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "sdkVersion:'25'"
          echo "The APK reports minimum SDK 25 (Android 7.1)."

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-v2.7-Dangbei-Android7-experimental
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
