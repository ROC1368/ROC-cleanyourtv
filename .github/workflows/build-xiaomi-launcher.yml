name: Build Xiaomi CleanYourTV v2.7 (fixed auto-launch)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build com.ts.launcher APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out official v2.7 source
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: v2.7.0

      - name: Fix repeated auto-launch after exiting Live TV
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("launcher/app/src/main/java/com/gathin/tvhome/MainActivity.java")
          source = p.read_text()
          old = 'prefs.edit().putInt("live_tv_boot", boot).apply();'
          new = 'if (!prefs.edit().putInt("live_tv_boot", boot).commit()) return false;'
          assert source.count(old) == 1, "Expected v2.7 startup line not found exactly once"
          p.write_text(source.replace(old, new, 1))
          print("Patched one-time boot launcher state to commit before opening Live TV.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build launcher with Xiaomi-compatible package name
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PlauncherApplicationId=com.ts.launcher

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-v2.7-com.ts.launcher-fixed-once
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
